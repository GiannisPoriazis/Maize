<div class="container-fluid p-4 bg-transparent g-0 h-100 d-inline-block">
    <div backgroundTheme theme class="row col-md-12 shadow-sm g-0 h-100 d-inline-block">
        <div class="d-flex flex-row align-items-start p-4">
            <div class="col-md-12">
                <span>{{pageTitle | translate}}</span>
                <hr>
                <form
                    [formGroup]="stationForm"
                    (ngSubmit)="onSubmit()">
                    <div class="row py-2">
                        <div class="col-md-4">
                            <div class="col-md-12">
                                <div class="form-floating">
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        id="StationName"
                                        placeholder="Station Name" 
                                        autocomplete="off" 
                                        name="StationName" 
                                        formControlName="station_name">
                                    <label>Station Name</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="col-md-12">
                                <div class="form-floating">
                                    <input 
                                        addressAutocomplete
                                        (placeSelected)="onPlaceSelected($event)"
                                        type="text" 
                                        class="form-control" 
                                        id="StationAddress"
                                        placeholder="Station Address" 
                                        autocomplete="off" 
                                        name="StationAddress" 
                                        formControlName="station_address">
                                    <label>Station Address</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="col-md-12">
                        <button *ngIf="!station" class="btn btn-primary" type="submit" [disabled]="!stationForm.valid">Create</button>
                        <button *ngIf="station" class="btn btn-primary" type="submit" [disabled]="!stationForm.valid">{{ 'general_save_button' | translate }}</button>
                        <button *ngIf="station" class="btn btn-danger ms-2" type="button" data-bs-toggle="modal" data-bs-target="#DeleteStationModal">{{ 'general_delete_button' | translate }}</button>
                        <button *ngIf="station" class="btn btn-secondary ms-2" type="button" (click)="backAction()">{{ 'general_return_button' | translate }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<modal
    type="confirmation"
    modalId="DeleteStationModal"
    modalTitle="Delete Station"
    modalBody="Are you sure you want to delete this station?"
    cancelClass="btn-secondary"
    cancelText="Cancel"
    confirmClass="btn-danger"
    confirmText="Delete"
    (confirmEvent)="deleteStation()">
</modal>
