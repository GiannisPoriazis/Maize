<div class="w-100 h-100">
    <span class="text-white px-2">Actions</span>
    <button class="btn btn-sm btn-success text-white" (click)="addRow()"><i class="fa-solid fa-plus"></i> New</button>
    <button class="btn btn-sm btn-danger text-white mx-1" (click)="removeRow()"><i class="fa-solid fa-trash"></i> Delete</button>
    <button *ngIf="!params?.disableSaveAction" class="btn btn-sm btn-primary text-white" (click)="updateData()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
</div>
