<div class="container-fluid p-4 bg-transparent g-0 h-100 d-inline-block">
    <div backgroundTheme theme class="row col-md-12 shadow-sm g-0 mb-4 d-inline-block">
        <div class="d-flex flex-row align-items-start p-4">
            <div class="col-md-12">
                <span>{{ 'modules_title' | translate }}</span>
            </div>
        </div>
    </div>
    <div backgroundTheme theme class="row mb-4 col-md-12 shadow-sm g-0 d-inline-block py-4 px-4">
        <div  class="col-md-12 px-4 card">            
            <p-dataView #dv [value]="activeModules()" layout="list">
                <ng-template pTemplate="list" let-activeModules>
                    <div class="grid grid-cols-12 grid-nogutter">
                        <div class="col-md-12" *ngFor="let module of activeModules; let first = first">
                            <div
                                class="flex flex-col sm:flex-row sm:items-center py-4 gap-4"
                                [ngClass]="{ 'border-top': !first }"
                            >
                                <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
                                    <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                                        <div class="flex flex-col md:items-end">
                                            <div class="flex flex-row-reverse md:flex-row pr-4">
                                                <p-checkbox (click)="toggleSelection(module.id)" size="large" [binary]="true" />
                                            </div>
                                        </div>
                                        <div>
                                            <h5 class="mt-2">{{ module.title }}</h5>
                                            <span class="font-medium text-secondary text-sm">{{ module.description }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </p-dataView>
        </div>
    </div>
    <div backgroundTheme class="row mb-4 col-md-12 shadow-sm g-0 d-inline-block">
        <div class="d-flex flex-row align-items-start p-3">
            <div class="col-md-12">
              <button type="submit"
                      class="btn btn-success"
                      [disabled]="!activeModules().length"
                      (click)="disableModules()">
                      {{ 'general_disable_button' | translate }}
              </button>
            </div>
        </div>
    </div>
</div>
