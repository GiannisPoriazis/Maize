<div *ngIf="!selectedVehicle" class="container-fluid p-4 bg-transparent g-0 h-100 d-inline-block">
    <div backgroundTheme theme class="row col-md-12 shadow-sm g-0 mb-4 d-inline-block">
        <div class="d-flex flex-row align-items-start p-4">
            <div class="col-md-12">
                <span>Manage Vehicles</span>
                <hr>
                <div class="col-md-3">
                    <form (ngSubmit)="onSubmit(searchVehicleForm)" #searchVehicleForm="ngForm">
                        <div class="form-floating">
                            <input
                                type="text" 
                                class="form-control" 
                                id="SearchVehicle"
                                name="SearchVehicle"
                                placeholder=""
                                ngModel>
                            <label for="SearchVehicle">Search Vehicle</label>
                        </div>
                        <button class="btn btn-primary mt-3" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div backgroundTheme theme class="row col-md-12 shadow-sm g-0 d-inline-block">
        <div class="d-flex flex-row align-items-start p-4">
            <div class="col-md-12">
                <grid
                    [colDefs]="colDefs"
                    [rowData]="rowData"
                    (rowDoubleClickedEvent)="selectVehicle($event)">
                </grid>
            </div>
        </div>
    </div>
</div>
<app-vehicle
    *ngIf="selectedVehicle"
    [vehicle]="selectedVehicle"
    (backActionEvent)="stopEdit()">
</app-vehicle>
