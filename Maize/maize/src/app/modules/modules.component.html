<div class="container-fluid p-4 bg-transparent g-0 h-100 d-inline-block">
    <div backgroundTheme theme class="row col-md-12 shadow-sm g-0 mb-4 d-inline-block">
        <div class="d-flex flex-row align-items-start p-4">
            <div class="col-md-12">
                <span>{{ 'modules_title' | translate }}</span>
            </div>
        </div>
    </div>
    <div backgroundTheme theme class="row col-md-12 shadow-sm g-0 h-100 d-inline-block d-flex align-items-center py-4 px-4">
        <div *ngFor="let module of modules; index as i" class="col-md-3 px-4 module-container">
            <div class="card module">
                <div class="card-body d-flex flex-column justify-content-between">
                    <span>
                        <h5 class="card-title">{{module.title}}</h5>
                        <p class="card-text">{{module.description}}</p>
                    </span>
                    <span>
                        <button type="button" *ngIf="!!module.price" (click)="enableModule(module.id)" class="btn btn-primary">{{module.price}} €</button>
                        <button type="button" *ngIf="!module.price" (click)="disableModule(module.id)" class="btn btn-primary">{{'general_disable_button' | translate}}</button>
                    </span>
                </div>
            </div>
        </div>

        <div class="col-md-3 px-4 module-container">
            <div class="card module" aria-hidden="true">
                <div class="card-body">
                  <h5 class="card-title placeholder-glow">
                    <span class="placeholder col-6"></span>
                  </h5>
                  <p class="card-text placeholder-glow">
                    <span class="placeholder col-7"></span>
                    <span class="placeholder col-4"></span>
                    <span class="placeholder col-4"></span>
                    <span class="placeholder col-6"></span>
                    <span class="placeholder col-8"></span>
                  </p>
                  <a class="btn btn-primary disabled placeholder col-6" aria-disabled="true"></a>
                </div>
            </div>
        </div>
    </div>
</div>
