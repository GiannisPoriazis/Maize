<div [class.bg-light]="theme == 1" [class.bg-black]="theme == 0" class="container-fluid p-0 h-100">
    <div class="d-flex flex-row align-items-start h-100">
        <div class="h-100 navmenu" [ngClass]="{ 'nav-menu-open': navMenuOpen, 'nav-menu-closed': !navMenuOpen }">
            <app-navmenu (menuOpenEvent)="toggleMenu($event)"></app-navmenu>
        </div>
        <div class="col w-100 h-100 mh-100 d-flex flex-column overflow-auto">
            <app-header class="px-4"></app-header>
            <router-outlet></router-outlet>  
        </div>
    </div>
</div>
<app-screen-lock 
    *ngIf="locked"
    (securityPinSubmited)="unlockApplication($event)"
    (lockScreenDestroyed)="lockPicked()"
></app-screen-lock>
<app-spinner *ngIf="isLoading"></app-spinner>
<app-star-background-animation *ngIf="theme == 0" class="background-dark-theme"></app-star-background-animation>
