<div class="container-fluid p-4 bg-transparent g-0 d-inline-block">
    <div backgroundTheme class="row mb-4 col-md-12 shadow-sm g-0 d-inline-block">
        <div class="d-flex flex-row align-items-start p-4">
            <div theme class="col-md-12">
                <span>{{ pageTitle | translate }}</span>
            </div>
        </div>
    </div>
    <div class="row col-md-12 g-0 h-100 d-inline-block">
        <div class="d-flex flex-row align-items-start">
            <div class="col-md-12">
                <form
                    [formGroup]="vehicleForm"
                    (ngSubmit)="onSubmit()">
                    <div class="row py-2">
                        <div class="accordion accordion-flush" id="accordionVehicleInformation">
                            <div class="accordion-item shadow-sm">
                                <h2 class="accordion-header">
                                    <button backgroundTheme theme class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#flush-vehicle-information" aria-expanded="true" aria-controls="flush-vehicle-information">
                                        Vehicle Information
                                    </button>
                                </h2>
                                <div backgroundTheme theme id="flush-vehicle-information" class="accordion-collapse collapse show" data-bs-parent="#accordionVehicleInformation">
                                    <div class="accordion-body">
                                        <div class="col-md-12 py-2">
                                            <div class="col-md-4">
                                                <div class="col-md-12">  
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label for="Registration" class="form-label m-0">Registration</label>                          
                                                        </div>
                                                        <div class="col-md-8">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="Registration"
                                                            autocomplete="off" 
                                                            name="Registration" 
                                                            formControlName="registration">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label for="Model_Id" class="form-label m-0">Model</label>                          
                                                        </div>
                                                        <div class="col-md-8">
                                                            <select 
                                                                class="form-select" 
                                                                id="Model_Id" 
                                                                name="Model_Id"
                                                                (change)="updateVehicleGroupType()" 
                                                                formControlName="model_id">
                                                                <option *ngFor="let model of dataTable.getValue().VehicleModel" [ngValue]="model.id">{{ model.description }}</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Vin / Year / CC</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="Vin"
                                                            autocomplete="off" 
                                                            name="Vin" 
                                                            formControlName="vin">
                                                        </div>
                                                        <div class="col-md-2">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="Year"
                                                            autocomplete="off" 
                                                            name="Year" 
                                                            formControlName="year">
                                                        </div>
                                                        <div class="col-md-2">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="CC"
                                                            autocomplete="off" 
                                                            name="CC" 
                                                            formControlName="cc">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Color / Gears</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <input 
                                                            type="color" 
                                                            class="form-control form-control-color" 
                                                            id="Color"
                                                            autocomplete="off" 
                                                            name="Color" 
                                                            formControlName="color">
                                                        </div>
                                                        <div class="col-md-4">
                                                            <select 
                                                                class="form-select" 
                                                                id="Gears" 
                                                                name="Gears" 
                                                                formControlName="gears">
                                                                <option *ngFor="let gear_type of vehicleGears" [ngValue]="gear_type['value']">{{ gear_type["key"] | translate }}</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label for="Mileage" class="form-label m-0">Mileage</label>                          
                                                        </div>
                                                        <div class="col-md-8">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="Mileage"
                                                            autocomplete="off" 
                                                            name="Mileage" 
                                                            formControlName="mileage">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Doors / Passengers</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="Doors"
                                                            autocomplete="off" 
                                                            name="Doors" 
                                                            formControlName="doors">
                                                        </div>
                                                        <div class="col-md-2">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="Passengers"
                                                            autocomplete="off" 
                                                            name="Passengers" 
                                                            formControlName="passengers">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Extras:</label>                          
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Air Condition</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="AirCondition" name="AirCondition" formControlName="air_condition" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Radio</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="Radio" name="Radio" formControlName="radio" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">GPS</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="GPS" name="GPS" formControlName="gps" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Touch Screen</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="TouchScreen" name="TouchScreen" formControlName="touch_screen" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Parking Camera</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="ParkingCamera" name="ParkingCamera" formControlName="parking_camera" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">USB</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="USB" name="USB" formControlName="usb" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Bluetooth</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="Bluetooth" name="Bluetooth" formControlName="bluetooth" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Mirror Link</label>                          
                                                        </div>
                                                        <div class="col-md-2">
                                                            <p-checkbox id="MirrorLink" name="MirrorLink" formControlName="mirrorlink" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion-item shadow-sm">
                                <h2 class="accordion-header">
                                    <button backgroundTheme theme class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-vehicle-addons" aria-expanded="false" aria-controls="flush-vehicle-addons">
                                        Vehicle Add-Ons
                                    </button>
                                </h2>
                                <div backgroundTheme theme id="flush-vehicle-addons" class="accordion-collapse collapse" data-bs-parent="#accordionVehicleAddons">
                                    <div class="accordion-body d-flex justify-content-center">
                                        <div class="col-md-10 py-2">
                                            <p-pickList
                                                [source]="sourceAddons"
                                                [target]="selectedAddons"
                                                [dragdrop]="true"
                                                [responsive]="true"
                                                [sourceStyle]="{ height: '25rem' }"
                                                [targetStyle]="{ height: '25rem' }"
                                                filterBy="title"
                                                sourceFilterPlaceholder="Search by name"
                                                targetFilterPlaceholder="Search by name"
                                                breakpoint="1400px"
                                                scrollHeight="30rem"
                                            >
                                                <ng-template let-addon let-selected="selected" pTemplate="addon">
                                                    <div class="flex flex-wrap p-1 items-center gap-4 w-full">
                                                        <div class="flex-1 flex flex-col">
                                                            <span>{{ addon.title }}</span>
                                                        </div>
                                                        <span class="font-bold">{{ '€' + addon.rate }}</span>
                                                    </div>
                                                </ng-template>
                                            </p-pickList>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion-item shadow-sm">
                                <h2 class="accordion-header">
                                    <button backgroundTheme theme class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-additional-information" aria-expanded="false" aria-controls="flush-additional-information">
                                        Additional Information
                                    </button>
                                </h2>
                                <div backgroundTheme theme id="flush-additional-information" class="accordion-collapse collapse" data-bs-parent="#accordionVehicleInformation">
                                    <div class="accordion-body">
                                        <div class="col-md-12 py-2">
                                            <div class="col-md-4">
                                                <div class="col-md-12">  
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Pool Type / State</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <select 
                                                                class="form-select" 
                                                                id="PoolType" 
                                                                name="PoolType" 
                                                                formControlName="pool_type">
                                                                <option *ngFor="let pool_type of vehiclePoolTypes" [ngValue]="pool_type['value']">{{ pool_type["key"] | translate }}</option>
                                                            </select>
                                                        </div>
                                                        <div class="col-md-4">
                                                            <select 
                                                                class="form-select" 
                                                                id="State" 
                                                                name="State" 
                                                                formControlName="state">
                                                                <option *ngFor="let state of vehicleStates" [ngValue]="state['value']">{{ state["key"] | translate }}</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Vehicle Group / Type</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="VehicleGroup"
                                                            autocomplete="off" 
                                                            name="VehicleGroup" 
                                                            formControlName="vehicle_group">
                                                        </div>
                                                        <div class="col-md-4">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="VehicleType"
                                                            autocomplete="off" 
                                                            name="VehicleType" 
                                                            formControlName="vehicle_type">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Daily Rate</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <div class="input-group">
                                                                <input 
                                                                type="text" 
                                                                class="form-control" 
                                                                id="DailyRate"
                                                                name="DailyRate" 
                                                                placeholder="00.00" 
                                                                aria-label="00.00"
                                                                autocomplete="off" 
                                                                formControlName="daily_rate">
                                                                <span class="input-group-text"><i class="fa-solid fa-euro-sign"></i></span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">License Required</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <p-checkbox id="LicenseRequired" name="LicenseRequired" formControlName="license_required" size="large" [binary]="true" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div *ngIf="!!vehicleForm.controls['license_required'].value" class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label m-0">Driver Minimum Age</label>                          
                                                        </div>
                                                        <div class="col-md-4">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="DriverMinimumAge"
                                                            autocomplete="off" 
                                                            name="DriverMinimumAge" 
                                                            formControlName="driver_minimum_age">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion-item shadow-sm">
                                <h2 class="accordion-header">
                                    <button backgroundTheme theme class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-insurance-information" aria-expanded="false" aria-controls="flush-insurance-information">
                                        Insurance Information
                                    </button>
                                </h2>
                                <div backgroundTheme theme id="flush-insurance-information" class="accordion-collapse collapse" data-bs-parent="#accordionVehicleInformation">
                                    <div class="accordion-body">
                                        <div class="col-md-12 py-2">
                                            <div class="col-md-4 py-2">
                                                <div class="col-md-12">  
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label for="InsuranceCompany" class="form-label">Company</label>                          
                                                        </div>
                                                        <div class="col-md-8">
                                                            <input 
                                                            type="text" 
                                                            class="form-control" 
                                                            id="InsuranceCompany"
                                                            autocomplete="off" 
                                                            name="InsuranceCompany" 
                                                            formControlName="insurance_company">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="col-md-12">
                                                    <div class="row g-3 py-2 align-items-center">
                                                        <div class="col-md-4">
                                                            <label class="form-label">Expiry</label>                          
                                                        </div>
                                                        <div class="col-md-8">
                                                            <datepicker
                                                                icon="fa-solid fa-calendar-days"
                                                                [control]="vehicleForm.get('insurance_expiry')"
                                                            ></datepicker>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div backgroundTheme class="row mt-4 col-md-12 shadow-sm g-0 d-inline-block">
                        <div class="d-flex flex-row align-items-start p-3">
                            <div class="col-md-12">
                                <button *ngIf="!vehicle" class="btn btn-primary" type="submit" [disabled]="!vehicleForm.valid">Create</button>
                                <button *ngIf="vehicle" class="btn btn-primary" type="submit" [disabled]="!vehicleForm.valid">{{ 'general_save_button' | translate }}</button>
                                <button *ngIf="vehicle" class="btn btn-danger ms-2" type="button" data-bs-toggle="modal" data-bs-target="#DeleteVehicleModal">{{ 'general_delete_button' | translate }}</button>
                                <button *ngIf="vehicle" class="btn btn-secondary ms-2" type="button" (click)="backAction()">Back</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<modal
    type="confirmation"
    modalId="DeleteVehicleModal"
    modalTitle="Delete Vehicle"
    modalBody="Are you sure you want to delete this vehicle?"
    cancelClass="btn-secondary"
    cancelText="Cancel"
    confirmClass="btn-danger"
    confirmText="Delete"
    (confirmEvent)="deleteVehicle()">
</modal>
